<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("jsa-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{color-scheme:dark;
--base:#050816;
--page:radial-gradient(1100px 700px at -12% 112%,rgba(38,98,255,.62),transparent 62%),radial-gradient(900px 600px at 112% -14%,rgba(84,70,220,.3),transparent 60%),radial-gradient(800px 520px at 104% 108%,rgba(120,170,255,.2),transparent 60%);
--shell:linear-gradient(180deg,rgba(8,12,32,.95) 0%,rgba(9,14,40,.88) 38%,rgba(13,27,84,.64) 100%);
--card:linear-gradient(180deg,rgba(255,255,255,.062),rgba(255,255,255,.022));
--tint:rgba(92,122,255,.07);--inset:rgba(5,9,26,.5);--solid:#0e1538;--solid-2:#121c4a;
--ink:#eef2ff;--muted:#a5b0d6;--faint:#7783ae;
--line:rgba(150,170,255,.17);--line-2:rgba(150,170,255,.34);--hair:rgba(150,170,255,.09);
--hover:rgba(110,150,255,.09);--sel:rgba(84,128,255,.19);
--blue:#4d82ff;--blue-hi:#8db4ff;--cyan:#43d3f3;--violet:#9c8cff;--green:#3ddba6;--amber:#f8bd5c;--red:#ff7482;--slate:#8a95bb;--on-dot:#06102e;
--btn:linear-gradient(180deg,#6293ff,#3c69f0);--btn-glow:0 8px 26px rgba(61,107,242,.5);
--shadow:0 30px 80px rgba(0,0,0,.45);
--font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif}
:root[data-theme=light]{color-scheme:light;
--base:#e8eefc;
--page:radial-gradient(1100px 700px at -12% 112%,rgba(92,140,255,.5),transparent 62%),radial-gradient(900px 600px at 112% -14%,rgba(160,150,255,.34),transparent 60%);
--shell:linear-gradient(180deg,rgba(255,255,255,.9),rgba(246,249,255,.84) 40%,rgba(224,234,255,.78));
--card:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.74));
--tint:rgba(60,110,255,.05);--inset:rgba(234,240,255,.85);--solid:#fff;--solid-2:#f1f5ff;
--ink:#0d1636;--muted:#4c5a86;--faint:#7480a8;
--line:rgba(52,84,190,.18);--line-2:rgba(52,84,190,.36);--hair:rgba(52,84,190,.1);
--hover:rgba(60,110,255,.07);--sel:rgba(60,110,255,.13);
--blue:#2f66ee;--blue-hi:#2f66ee;--cyan:#0a9cc2;--violet:#6a57e3;--green:#0f9469;--amber:#b06c00;--red:#d6334a;--slate:#66739b;--on-dot:#fff;
--shadow:0 30px 80px rgba(40,60,140,.18)}
*{box-sizing:border-box}
html{background:var(--base)}
body{margin:0;min-height:100vh;background-color:var(--base);background-image:var(--page);background-attachment:fixed;background-repeat:no-repeat;color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue-hi)}
:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px}
[hidden]{display:none!important}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.faint{color:var(--faint)}
.nw{white-space:nowrap}
.grow{flex:1}

.shell{margin:14px;border:1px solid var(--line);border-radius:26px;background:var(--shell);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.06);min-height:calc(100vh - 28px);display:flex;flex-direction:column}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 15px;border:1px solid var(--line-2);border-radius:12px;background:var(--card);font-weight:600;font-size:13.5px;white-space:nowrap;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .08s,box-shadow .15s}
.btn:hover{border-color:var(--blue-hi)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--btn);border-color:rgba(170,198,255,.55);color:#fff;box-shadow:var(--btn-glow),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.primary:hover{box-shadow:0 10px 32px rgba(61,107,242,.72),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.sm{height:34px;padding:0 12px;font-size:12.5px;border-radius:10px}
.btn.sm .ic{width:15px;height:15px}
.btn.danger{color:var(--red)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--hover)}
.round{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:var(--card);padding:0;position:relative;flex:none;transition:border-color .15s,box-shadow .15s}
.round:hover{border-color:var(--blue-hi);box-shadow:0 0 18px rgba(77,130,255,.35)}
.round.sm{width:34px;height:34px}
.round.sm .ic{width:15px;height:15px}
.round:disabled{opacity:.35;cursor:default;box-shadow:none}
.round[aria-pressed=true]{background:var(--btn);border-color:transparent;color:#fff;box-shadow:var(--btn-glow)}
[data-tip]::after{content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%) translateX(-4px);background:var(--solid);color:var(--ink);border:1px solid var(--line-2);border-radius:9px;padding:6px 10px;font:500 12.5px var(--font);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.35)}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1;transform:translateY(-50%)}
.tip-down[data-tip]::after{left:auto;right:0;top:calc(100% + 10px);transform:translateY(-4px)}
.tip-down[data-tip]:hover::after,.tip-down[data-tip]:focus-visible::after{transform:none}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:20px 24px 14px;position:relative;z-index:22}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;font-size:25px;font-weight:600;letter-spacing:-.02em;padding:0;margin-right:18px;white-space:nowrap}
.logo{width:30px;height:30px;filter:drop-shadow(0 0 10px rgba(77,130,255,.6))}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:6px 2px}
.nav::-webkit-scrollbar{display:none}
.nav button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:9px 13px;border-radius:12px;font-weight:500;font-size:14px;white-space:nowrap;transition:background .15s}
.nav button:hover{background:var(--hover)}
.nav button[aria-current]{background:var(--btn);color:#fff;box-shadow:var(--btn-glow)}
.nav em{font-style:normal;font-size:11.5px;font-weight:700;min-width:20px;padding:1px 6px;border-radius:99px;background:var(--hover);text-align:center}
.nav button[aria-current] em{background:rgba(255,255,255,.22)}
.nav .ic{width:16px;height:16px}
.search{display:flex;align-items:center;gap:9px;height:40px;min-width:230px;padding:0 14px;border:1px solid var(--line-2);border-radius:99px;background:var(--card);color:var(--muted);font-size:13.5px}
.search span{flex:1;text-align:left}
kbd{font:600 11px var(--font);border:1px solid var(--line-2);border-radius:6px;padding:1px 6px;color:var(--muted)}
#belln{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:#ff3b52;color:#fff;font:700 11px/19px var(--font);text-align:center}
.me{background:linear-gradient(135deg,#7fb2ff,#6b5cf0);border-color:rgba(255,255,255,.4);color:#fff;font-weight:700;font-size:13px}

/* page head */
.head{position:relative;z-index:21;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:14px 20px;padding:8px 24px 20px}
.head h1{font-size:23px}
.head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.head-r{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.chips{display:flex;gap:10px}
.chip{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 13px;white-space:nowrap;border:1px solid var(--line-2);border-radius:12px;background:var(--card);font-size:12.5px;color:var(--muted)}
.chip:hover{border-color:var(--blue-hi)}
.chip b{color:var(--ink);font-weight:600}
.chip .ic{width:16px;height:16px}
.split{position:relative;display:flex}
.split .btn.primary{border-radius:12px 0 0 12px}
.split .btn.more{border-radius:0 12px 12px 0;padding:0 10px;border-left-color:rgba(255,255,255,.3)}
.menu{position:absolute;right:0;top:calc(100% + 8px);z-index:25;min-width:300px;padding:6px;border:1px solid var(--line-2);border-radius:14px;background:var(--solid);box-shadow:0 20px 50px rgba(0,0,0,.45)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 11px;border-radius:9px;font-size:13.5px}
.menu button:hover{background:var(--hover)}
.menu button .ic{color:var(--blue-hi);width:16px;height:16px}
.menu label{display:block;padding:9px 11px 3px;font-size:12.5px;color:var(--muted)}
.menu select{width:calc(100% - 22px);margin:0 11px 9px;padding:7px 8px;border:1px solid var(--line);border-radius:9px;background:var(--inset)}

.notice{margin:0 24px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:13px 16px;border-radius:14px;border:1px solid color-mix(in srgb,var(--amber) 45%,transparent);background:color-mix(in srgb,var(--amber) 12%,transparent)}
.notice p{margin:0;flex:1;min-width:230px}
.notice.bad{border-color:color-mix(in srgb,var(--red) 45%,transparent);background:color-mix(in srgb,var(--red) 12%,transparent)}

/* body */
.body{display:grid;grid-template-columns:40px minmax(0,1fr);gap:24px;padding:0 24px 26px;flex:1}
.rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:18px;align-self:start;z-index:20}
.rail-gap{height:22px;flex:none}
.content{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.pad{padding:18px}
.beam::after,.beam-top::before{content:"";position:absolute;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--blue-hi),transparent);box-shadow:0 0 18px 2px rgba(80,140,255,.7);pointer-events:none}
.beam::after{left:32%;right:32%;bottom:-1px}
.beam-top::before{left:6%;width:16%;top:-1px}

.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.stat{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 9px;text-align:left;padding:17px 18px 15px;overflow:hidden;transition:border-color .2s,box-shadow .2s,transform .15s}
.stat:hover{border-color:var(--line-2);transform:translateY(-1px)}
.stat b{font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:12.5px;font-weight:600;white-space:nowrap}
.stat small{flex-basis:100%;min-width:0;display:flex;align-items:center;gap:5px;margin-top:7px;color:var(--faint);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small .up{font-style:normal;color:var(--green);display:inline-flex;align-items:center;gap:3px;font-weight:600}
.stat small .ic{width:12px;height:12px}
.stat.on{border-color:var(--line-2);box-shadow:inset 0 0 0 1px rgba(110,150,255,.25),0 0 26px rgba(61,107,242,.2)}
.stat.alert b{color:var(--amber)}
.stat.hot{border-color:rgba(120,165,255,.6)}
.stat.hot::after,.task.running::after{content:"";position:absolute;bottom:0;left:-35%;width:35%;height:2px;background:linear-gradient(90deg,transparent,#9cc2ff,transparent);box-shadow:0 0 16px 3px rgba(90,150,255,.9);animation:sweep 1.9s ease-in-out infinite}
@keyframes sweep{to{left:100%}}

.task{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;overflow:hidden;font-size:13.5px}
.task b{white-space:nowrap;font-weight:600}
.task .line{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font:12.5px ui-monospace,Menlo,monospace}
.task.running{border-color:rgba(120,165,255,.55);box-shadow:0 0 30px rgba(61,107,242,.18)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--blue-hi);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.dot{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;flex:none;color:var(--on-dot);background:var(--c,var(--blue))}
.dot .ic{width:15px;height:15px;stroke-width:2.1}
.dot.mini{width:22px;height:22px}
.dot.mini .ic{width:12px;height:12px}
.c-green{--c:var(--green)}.c-amber{--c:var(--amber)}.c-red{--c:var(--red)}.c-blue{--c:var(--blue-hi)}.c-violet{--c:var(--violet)}.c-cyan{--c:var(--cyan)}.c-slate{--c:var(--slate)}
.tag{display:inline-flex;align-items:center;gap:5px;max-width:100%;font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;white-space:nowrap;color:var(--c,var(--slate));background:color-mix(in srgb,var(--c,var(--slate)) 15%,transparent)}

.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,390px);gap:16px;align-items:start}
.col{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-width:0}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px}
#geo{display:flex;flex-direction:column}

/* filter bar */
.fbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.fseg{position:relative;display:flex;align-items:center;gap:8px;padding:0 12px;height:48px;border-right:1px solid var(--line);font-weight:600;font-size:13.5px;min-width:0}
.fseg>.ic:first-child{width:16px;height:16px;color:var(--muted)}
.fseg:last-child{border-right:0}
.fseg select{appearance:none;-webkit-appearance:none;background:none;border:0;font-weight:600;flex:1;min-width:0;width:100%;padding:13px 18px 13px 0;cursor:pointer;text-overflow:ellipsis;outline:none}
.fseg:focus-within{box-shadow:inset 0 0 0 2px var(--blue)}
.fseg .caret{position:absolute;right:10px;pointer-events:none;width:14px;height:14px;color:var(--muted)}
.fseg.off{color:var(--faint);font-weight:500;font-size:13.5px}

/* table card */
.tcard{padding:18px 18px 16px}
.ttl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ttl h2{font-size:21px}
.count{font-size:12px;border:1px solid var(--line-2);border-radius:10px;padding:4px 10px;color:var(--muted)}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tbox{border:1px solid var(--line);border-radius:14px;background:var(--tint)}
.tsearch{display:flex;align-items:center;gap:12px;padding:12px;flex-wrap:wrap}
.find{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;height:40px;flex:0 1 260px;min-width:170px;background:var(--inset);color:var(--muted)}
.find:focus-within{border-color:var(--blue-hi);box-shadow:0 0 0 3px rgba(77,130,255,.22)}
.find input{border:0;background:none;outline:none;width:100%;color:var(--ink)}
.hint{color:var(--faint);font-size:12.5px;flex:1;min-width:120px}
.scroll-x{overflow-x:auto}
table{width:100%;border-collapse:collapse}
table.jobs{table-layout:fixed}
table.jobs th:nth-child(2){width:24%}table.jobs th:nth-child(3){width:84px}table.jobs th:nth-child(4){width:100px}table.jobs th:nth-child(5){width:178px}
table.jobs td{overflow:hidden}
th{text-align:left;font-size:13px;font-weight:600;padding:13px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
th[data-sort]{cursor:pointer}
th .sort{display:inline-grid;gap:2px;margin-left:7px;vertical-align:middle}
th .sort i{display:block;border:3.5px solid transparent}
th .sort i:first-child{border-bottom-color:var(--faint);border-top-width:0}
th .sort i:last-child{border-top-color:var(--faint);border-bottom-width:0}
th[aria-sort=ascending] .sort i:first-child{border-bottom-color:var(--blue-hi)}
th[aria-sort=descending] .sort i:last-child{border-top-color:var(--blue-hi)}
td{padding:12px 16px;border-bottom:1px solid var(--hair);font-size:13.5px;vertical-align:middle}
tr.row{cursor:pointer;transition:background .15s}
tr.row:hover{background:var(--hover)}
tr.row[aria-selected=true]{background:var(--sel);box-shadow:inset 3px 0 0 var(--blue)}
tr.row:focus-visible{outline-offset:-2px}
.jobc{display:flex;align-items:center;gap:12px;min-width:0}
.jt{min-width:0;display:grid}
.jt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jt small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc{white-space:nowrap;text-overflow:ellipsis}
.loc .fl{margin-right:8px;font-size:15px}
.sc{display:inline-grid;gap:4px;min-width:44px}
.sc b{font-weight:700;font-variant-numeric:tabular-nums}
.sc .bar{height:4px;width:44px}
.sc .bar u{transition:none;background:currentColor}
.sc.s4{color:var(--green)}.sc.s3{color:var(--blue-hi)}.sc.s2{color:var(--amber)}.sc.s1{color:var(--slate)}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;font-weight:700;font-size:13.5px;color:#fff;flex:none;background:linear-gradient(135deg,hsl(var(--h) 85% 64%),hsl(calc(var(--h) + 45) 75% 46%));box-shadow:inset 0 0 0 2px rgba(255,255,255,.22)}
.av.lg{width:52px;height:52px;font-size:20px}
.tfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.pager{display:flex;gap:8px}
.pager button{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line-2);background:none;font-weight:600;padding:0}
.pager button:hover:not(:disabled){border-color:var(--blue-hi)}
.pager button[aria-current]{background:var(--btn);border-color:transparent;color:#fff;box-shadow:var(--btn-glow)}
.pager button:disabled{opacity:.4;cursor:default}
.pager .ic{width:15px;height:15px}
.empty{padding:38px 20px;text-align:center;color:var(--muted)}
.empty h3{font-size:17px;color:var(--ink);margin-bottom:6px}
.empty .btn{margin-top:14px}

/* widgets */
.side{padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-width:0}
.chead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.chead h2{font-size:20px}
.cicon{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);color:var(--blue-hi);flex:none}
.link{border:0;background:none;color:var(--muted);font-size:12px;display:inline-flex;align-items:center;gap:4px;padding:4px 6px;border-radius:8px;white-space:nowrap}
.link:hover{color:var(--ink);background:var(--hover)}
.link .ic{width:13px;height:13px}
.panel{border:1px solid var(--line);border-radius:14px;background:var(--tint);padding:14px}
.donut{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px 18px}
.ringbox{position:relative;width:150px;height:150px;flex:none}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 12px rgba(77,130,255,.5));display:block}
.ringbox circle{fill:none;stroke-width:17}
.ringbox .track{stroke:var(--hair)}
.ringbox .seg{transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
.ringbox .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringbox .mid b{font-size:30px;font-weight:600;line-height:1}
.ringbox .mid span{color:var(--muted);font-size:13px;margin-top:4px}
.legend{flex:1 1 150px;min-width:0;display:grid;gap:9px;font-size:13.5px}
.legend div{display:grid;grid-template-columns:8px 1fr auto;gap:9px;align-items:center}
.legend i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.legend span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend b{font-weight:600;font-variant-numeric:tabular-nums}
.tlist{padding:8px}
.tm{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:5px 12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 6px;border-radius:12px}
.tm:hover{background:var(--hover)}
.tm .av{grid-row:1/3}
.tm .n{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .n small{color:var(--faint);margin-left:8px;font-size:12px}
.tm .v{font-weight:600;font-variant-numeric:tabular-nums}
.tm .bar{grid-column:2/4}
.bar{display:block;height:6px;border-radius:99px;background:var(--hair);overflow:hidden}
.bar u{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--violet),var(--blue));transition:width .9s cubic-bezier(.2,.8,.2,1);text-decoration:none}
.geo{position:relative;flex:1;display:grid;align-content:space-evenly;border-radius:14px;background:var(--inset);border:1px solid var(--hair);padding:14px 18px 12px;overflow:hidden}
.geo::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(140,170,255,.36) 1px,transparent 1.5px);background-size:10px 10px;-webkit-mask-image:radial-gradient(58% 78% at 70% 46%,#000 15%,transparent 100%);mask-image:radial-gradient(58% 78% at 70% 46%,#000 15%,transparent 100%);opacity:.75}
.gr{position:relative;display:grid;grid-template-columns:minmax(0,138px) minmax(0,1fr);gap:14px;align-items:end;padding:8px 0}
.gl{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gb{position:relative;padding-top:18px}
.gb b{position:absolute;top:0;left:max(var(--w),30px);transform:translateX(-100%);font-size:11.5px;font-weight:600}
.gr .bar u{background:linear-gradient(90deg,var(--blue),var(--cyan))}
.gr+.gr .bar u{background:linear-gradient(90deg,var(--violet),color-mix(in srgb,var(--violet) 45%,#fff))}
#next{container-type:inline-size}
.steps{display:grid;gap:2px}
@container (max-width:400px){.step{grid-template-columns:30px minmax(0,1fr)}.step .btn{grid-column:2;justify-self:start}}
.step{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 2px}
.step b{display:block;font-weight:500;font-size:13.5px}
.step small{color:var(--faint);font-size:12px}

/* job drawer */
.scrim{position:fixed;inset:0;z-index:39;background:rgba(3,6,20,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
body.reading{overflow:hidden}
body.reading .scrim{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:40;top:14px;right:14px;bottom:14px;width:min(690px,calc(100vw - 28px));overflow:auto;border:1px solid var(--line-2);border-radius:22px;background:linear-gradient(180deg,var(--solid),var(--solid-2));box-shadow:-30px 0 90px rgba(0,0,0,.5);transform:translateX(calc(100% + 40px));transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:18px 24px 40px;overflow-x:hidden}
body.reading .drawer{transform:none}
.d-bar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.d-head{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:16px;align-items:center}
.d-head h2{font-size:24px;line-height:1.15;overflow-wrap:anywhere}
.meta{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:13px}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta .ic{width:14px;height:14px}
.dial{position:relative;width:88px;height:88px}
.dial svg{transform:rotate(-90deg);display:block;filter:drop-shadow(0 0 10px rgba(77,130,255,.45))}
.dial circle{fill:none;stroke-width:8}
.dial .track{stroke:var(--hair)}
.dial .val{stroke:var(--blue-hi);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.dial.s4 .val{stroke:var(--green)}.dial.s2 .val{stroke:var(--amber)}.dial.s1 .val{stroke:var(--slate)}
.dial b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0 0}
.acts select{height:40px;padding:0 10px;border:1px solid var(--line-2);border-radius:12px;background:var(--inset)}
.block{margin-top:16px;border:1px solid var(--line);border-radius:16px;background:var(--tint);padding:16px 18px;min-width:0;overflow-wrap:anywhere}
.block h3{font-size:15.5px;margin-bottom:10px;display:flex;align-items:center;gap:9px}
.block h3 .ic{color:var(--blue-hi)}
.block p{margin:0 0 10px;max-width:68ch}
.block .acts{margin-top:4px}
.lbl{color:var(--muted);margin-bottom:6px!important;font-size:13px}
.chipsl{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;padding:0;list-style:none}
.drawer .tag{white-space:normal;border-radius:12px;text-align:left}
.drawer .d-bar .tag{white-space:nowrap;border-radius:99px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:5px 12px;margin:0 0 12px}
.torow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.torow label{color:var(--muted);width:28px}
.torow .field{flex:1 1 220px;width:auto;margin:0}
.toinfo{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;color:var(--muted);font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.field{display:block;width:100%;border:1px solid var(--line-2);border-radius:12px;background:var(--inset);padding:10px 12px;margin:0 0 8px;transition:border-color .15s,box-shadow .15s}
.field:focus{outline:none;border-color:var(--blue-hi);box-shadow:0 0 0 3px rgba(77,130,255,.25)}
textarea.field{min-height:300px;line-height:1.5;resize:vertical}
textarea.field.short{min-height:84px}
.mail{border:1px solid var(--line);border-radius:12px;background:var(--inset);padding:14px 16px;margin:0 0 8px}
.mail p{margin:0 0 10px}
details>summary{cursor:pointer;color:var(--muted);margin:8px 0}
.desc{white-space:pre-wrap;font-size:13.5px}
.history{list-style:none;margin:0;padding:0;font-size:13.5px;color:var(--muted)}
.history li{padding:3px 0}
.history b{color:var(--ink);font-weight:500}

/* pages */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.span2{grid-column:1/-1}
.page .sub{color:var(--muted);margin:-6px 0 14px;max-width:72ch;font-size:13.5px}
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px}
.week div{border:1px solid var(--line);border-radius:14px;background:var(--tint);padding:14px 16px}
.week b{display:block;font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.week span{font-size:12.5px;color:var(--muted)}
.bars{display:grid;gap:12px}
.brow{display:grid;grid-template-columns:minmax(110px,190px) 1fr auto;gap:12px;align-items:center;font-size:13.5px}
.brow span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .bar{height:8px}
.brow .n{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
pre.out{margin:0;background:rgba(3,6,18,.82);color:#d5e0ff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font:12.5px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow:auto;max-height:440px}
.check{display:grid;grid-template-columns:24px 180px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--hair);align-items:center}
.check:last-child{border-bottom:0}
.check b{font-weight:600}
.check>span:last-child{color:var(--muted);overflow-wrap:anywhere;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.inline{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inline input[type=time]{height:40px;padding:0 10px;border:1px solid var(--line-2);border-radius:12px;background:var(--inset)}

/* dialogs, palette, toasts */
dialog{border:1px solid var(--line-2);border-radius:20px;background:linear-gradient(180deg,var(--solid),var(--solid-2));color:var(--ink);padding:22px;width:min(560px,calc(100vw - 32px));box-shadow:0 30px 90px rgba(0,0,0,.55)}
dialog::backdrop{background:rgba(3,6,20,.62);backdrop-filter:blur(3px)}
dialog[open]{animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
dialog h2{font-size:19px;margin-bottom:8px}
dialog p{margin:0 0 14px;color:var(--muted)}
dialog .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
#palette{padding:0;width:min(620px,calc(100vw - 32px));margin-top:12vh}
#palette input{width:100%;border:0;border-bottom:1px solid var(--line);padding:17px 20px;font-size:16.5px;background:none;outline:none}
#palette ul{list-style:none;margin:0;padding:6px;max-height:52vh;overflow:auto}
#palette li button{display:grid;grid-template-columns:1fr auto;gap:12px;width:100%;text-align:left;border:0;background:none;padding:10px 13px;border-radius:10px}
#palette li button span{color:var(--faint);font-size:12.5px}
#palette li button.cur,#palette li button:hover{background:var(--sel)}
.toasts{position:fixed;right:28px;bottom:28px;display:grid;gap:8px;z-index:60;max-width:min(440px,calc(100vw - 56px))}
.toast{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line-2);background:var(--solid);border-radius:14px;padding:11px 14px;box-shadow:0 14px 40px rgba(0,0,0,.4);animation:pop .2s ease-out}
.toast .ic{margin-top:2px;color:var(--green)}
.toast.bad{border-color:color-mix(in srgb,var(--red) 60%,transparent)}
.toast.bad .ic{color:var(--red)}

@media (max-width:1560px){.search{min-width:0;width:40px;padding:0;justify-content:center}.search span,.search kbd{display:none}}
@media (max-width:1400px){.chips{display:none}}
@media (max-width:1200px){.top{flex-wrap:wrap}.brand{margin-right:auto}.nav{order:5;flex-basis:100%}}
@media (max-width:1280px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.grid{grid-template-columns:minmax(0,1fr)}.chips{display:none}}
@media (max-width:900px){
  .shell{margin:8px;border-radius:20px;min-height:calc(100vh - 16px)}
  .top{padding:16px 16px 8px}
  .brand{font-size:21px}
  .head{grid-template-columns:minmax(0,1fr);padding:8px 16px 16px}
  .head-r{justify-content:flex-start}
  .task{flex-wrap:wrap}
  .task .line{order:5;flex-basis:100%}
  table.jobs th:nth-child(2),table.jobs td:nth-child(2),table.jobs th:nth-child(4),table.jobs td:nth-child(4){display:none}
  table.jobs th:nth-child(5){width:142px}
  table.jobs th:nth-child(3){width:62px}
  table.jobs .av{display:none}
  td,th{padding-left:12px;padding-right:12px}
  .tcard{padding:14px 12px 12px}
  .notice{margin:0 16px 14px}
  .body{grid-template-columns:minmax(0,1fr);padding:0 16px 20px;gap:14px}
  .rail{flex-direction:row;position:static;overflow-x:auto;scrollbar-width:none;padding:3px}
  .rail::-webkit-scrollbar{display:none}
  .rail-gap{width:8px;height:auto}
  [data-tip]::after{display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pair,.pgrid{grid-template-columns:minmax(0,1fr)}
  .fbar{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fseg:nth-child(2){border-right:0}
  .fseg:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .donut{flex-direction:column}
  .legend{width:100%}
  .drawer{top:0;right:0;bottom:0;width:100vw;border-radius:0;border:0;padding:14px 16px 30px}
  .d-head{grid-template-columns:44px minmax(0,1fr)}
  .d-head .av.lg{width:44px;height:44px}
  .d-head .dial{grid-column:1/-1}
  .check{grid-template-columns:24px 1fr}
  .check>span:last-child{grid-column:2}
  .step{grid-template-columns:30px minmax(0,1fr)}
  .step .btn{grid-column:2;justify-self:start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
"use strict";
const TOKEN = "__TOKEN__";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ic = (n, c = "") => `<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const PAGE = 8, LIST = ["shortlist", "progress", "followups", "matches"];
const ACTIVE = ["applied", "interviewing", "offer"], ASIDE = ["skipped", "rejected", "withdrawn"];
const calm = matchMedia("(prefers-reduced-motion:reduce)").matches;
const S = { state: null, inited: false, view: "shortlist", sel: null, detail: null, matches: null, q: "", page: 0,
            f: { country: "", score: 0, posted: 0, extra: "" }, sort: { key: "", dir: 1 }, lsig: "", wsig: "",
            lines: [], taskId: 0, wasRunning: false, polling: false, dirty: false, counted: false, dismissed: 0, settings: null, insights: null };
const VIEWS = {
  shortlist: ["Shortlist", "Jobs that scored well against your resume. Draft the email, find the address, send."],
  progress: ["In progress", "Applications under way, and the jobs you set aside."],
  followups: ["Follow-ups", "Emails that have had no reply for a few days."],
  matches: ["All matches", "Every job scored against your resume, newest first."],
  insights: ["Insights", "Your week, the skills you are missing, and which sites deliver."],
  activity: ["Activity", "What the program is doing now, and past searches."],
  settings: ["Settings", "Setup, the daily run, your email template and limits."],
};
const HOT = { run: ["found", "scored"], daily: ["found", "scored", "shortlisted"], add: ["found", "scored", "shortlisted"], contacts: ["shortlisted"], email: ["shortlisted"],
              send: ["shortlisted", "emailed", "applied"], "gmail-drafts": ["shortlisted"], "cover-letter": ["shortlisted"], followups: ["due"] };
const STATUS_C = { shortlisted: "c-blue", applied: "c-cyan", interviewing: "c-violet", offer: "c-green", rejected: "c-red", skipped: "c-slate", withdrawn: "c-slate" };
const COUNTRIES = [["UAE", "🇦🇪", /\b(uae|united arab emirates|dubai|abu dhabi|sharjah|ajman)\b/], ["Saudi Arabia", "🇸🇦", /\b(saudi|ksa|riyadh|jeddah|dammam|khobar)\b/], ["Qatar", "🇶🇦", /\b(qatar|doha)\b/],
  ["India", "🇮🇳", /\b(india|ahmedabad|gandhinagar|bengaluru|bangalore|pune|hyderabad|mumbai|chennai|gurugram|gurgaon|noida|delhi|kolkata)\b/]];
const countryOf = loc => { const l = (loc || "").toLowerCase(); return (COUNTRIES.find(c => c[2].test(l)) || ["Remote"])[0]; };
const flagOf = c => (COUNTRIES.find(x => x[0] === c) || [0, "🌐"])[1];
const countryName = c => c === "Remote" ? "Remote or other" : c;

async function api(path, body, raw) {
  const opt = { headers: { "X-Token": TOKEN } };
  if (raw) { opt.method = "POST"; opt.body = raw.body; Object.assign(opt.headers, raw.headers); }
  else if (body !== undefined) { opt.method = "POST"; opt.body = JSON.stringify(body); opt.headers["Content-Type"] = "application/json"; }
  let res;
  try { res = await fetch(path, opt); }
  catch { throw new Error("The page lost contact with the job search program. Open Job Search again to restart it."); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "That did not work.");
  return data;
}
function toast(msg, bad) {
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : ""); t.innerHTML = ic(bad ? "alert" : "check") + "<span></span>"; t.lastChild.textContent = msg;
  $("#toasts").append(t); setTimeout(() => t.remove(), bad ? 9000 : 4500);
}
const fail = e => toast(e.message, true);
function ask(title, text, ok, no = "Cancel") {
  const d = $("#ask");
  $("h2", d).textContent = title; $("p", d).textContent = text; $(".primary", d).textContent = ok; $("[value=no]", d).textContent = no;
  d.showModal();
  return new Promise(res => {
    const done = v => { d.close(); d.onclick = null; d.oncancel = null; res(v); };
    d.onclick = e => { if (e.target.value) done(e.target.value === "yes"); };
    d.oncancel = () => done(false);
  });
}
function ago(iso) {
  if (!iso) return "";
  const h = Math.max(0, (Date.now() - new Date(iso)) / 36e5);
  return h < 1 ? "just now" : h < 24 ? `${Math.floor(h)}h ago` : `${Math.floor(h / 24)}d ago`;
}
const day = iso => iso ? new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short" }) : "";
const when = iso => iso ? new Date(iso).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
const tier = s => s == null ? "s0" : s >= 85 ? "s4" : s >= 75 ? "s3" : s >= 60 ? "s2" : "s1";
const statusOf = r => r.status || r.application_status || "";
const http = u => /^https?:\/\//.test(u || "");
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const initials = n => (n || "?").trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
const hue = s => { let h = 0; for (const ch of String(s || "")) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; };
const avatar = (name, cls = "") => `<span class="av ${cls}" style="--h:${hue(name)}" aria-hidden="true">${esc(((name || "").trim()[0] || "?").toUpperCase())}</span>`;
const grow = root => requestAnimationFrame(() => requestAnimationFrame(() => $$("u[data-w]", root).forEach(u => u.style.width = u.dataset.w + "%")));

/* ---------- state and chrome ---------- */
async function refresh() {
  try { S.state = await api("/api/state"); } catch (e) { $("#vsub").textContent = e.message; return; }
  renderChrome(); renderNotices();
  if (!S.inited) await showView(S.view, true);
  else if (LIST.includes(S.view)) { renderList(); renderWidgets(); }
  trackTask();
}
function renderChrome() {
  const st = S.state, c = st.counts || {}, p = st.setup.profile, t = st.task, [title, sub] = VIEWS[S.view];
  const me = $("#me"); me.textContent = p ? initials(p.name) : "?"; me.dataset.tip = p ? `${p.name}: settings` : "Settings";
  const bn = $("#belln"); bn.textContent = c.due || ""; bn.hidden = !c.due;
  $$("#tabs [data-view]").forEach(b => b.dataset.view === S.view ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  $$("#tabs [data-c]").forEach(e => { const n = c[e.dataset.c] || 0; e.textContent = n; e.hidden = !n; });
  $("#vtitle").textContent = title; $("#vsub").textContent = sub;
  const se = st.search || {};
  const chips = [["layers", "Sites", st.sources.length], ["calendar", "Posted", se.max_age_days ? `Last ${se.max_age_days} days` : "Any time"], ["briefcase", "Pay", se.min_salary_lpa ? `${se.min_salary_lpa} LPA or more` : "Any"]]
    .map(([i, l, v]) => `<button class="chip" data-view="settings">${ic(i)}<span>${l}:</span><b>${esc(v)}</b></button>`).join("");
  if ($("#chips").dataset.k !== chips) { $("#chips").innerHTML = chips; $("#chips").dataset.k = chips; }
  const subs = {
    found: c.found_week ? `<i class="up">${ic("trending")}+${c.found_week.toLocaleString()}</i> this week` : `from ${st.sources.length} sites`,
    scored: "against your resume", shortlisted: `scoring ${st.shortlist_min_score} or more`,
    emailed: st.sends ? `${st.sends.today} sent today${st.sends.cap ? ", limit " + st.sends.cap : ""}` : "none sent yet",
    applied: "in progress", due: c.due ? "due now" : `${st.follow_up_days} days after an email` };
  const hot = t && t.running ? HOT[t.action] || [] : [];
  $$("#stats .stat").forEach(b => {
    const k = b.dataset.n, n = c[k] ?? 0, num = $("b", b), sm = $("small", b);
    if (!S.counted && n > 0 && !calm) countUp(num, n); else num.textContent = n.toLocaleString();
    if (sm.dataset.k !== subs[k]) { sm.innerHTML = subs[k]; sm.dataset.k = subs[k]; }
    b.classList.toggle("on", b.dataset.on === S.view);
    b.classList.toggle("hot", hot.includes(k));
    b.classList.toggle("alert", k === "due" && n > 0);
  });
  if (st.counts) S.counted = true;
  const sel = $("#onesite");
  if (sel.options.length !== st.sources.length + 1)
    sel.innerHTML = '<option value="">Choose a site</option>' + st.sources.map(s => `<option>${esc(s)}</option>`).join("");
  renderLive();
}
function countUp(el, n) {
  const t0 = performance.now(), dur = 800;
  const step = t => { const k = Math.min(1, (t - t0) / dur); el.textContent = Math.round(n * (1 - Math.pow(1 - k, 3))).toLocaleString(); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function renderLive() {
  const t = S.state.task, live = $("#live");
  if (!t || (!t.running && S.dismissed === t.id)) { live.hidden = true; live.dataset.k = ""; return; }
  const key = `${t.id}:${t.running}`;
  if (live.dataset.k === key) { $(".line", live).textContent = t.last || (t.running ? "starting" : ""); return; }
  live.dataset.k = key; live.hidden = false; live.classList.toggle("running", t.running);
  if (t.running) {
    live.innerHTML = `<span class="spin"></span><b>${esc(t.label)}</b><span class="line">${esc(t.last || "starting")}</span>
      <button class="btn sm" data-view="activity">Show output</button><button class="btn sm danger" data-act="stop">${ic("square")}Stop</button>`;
  } else {
    const ok = t.exit_code === 0 && !t.stopped;
    live.innerHTML = `<span class="dot ${ok ? "c-green" : "c-amber"}">${ic(ok ? "check" : "alert")}</span><b>${esc(t.label)}: ${t.stopped ? "stopped" : ok ? "done" : "did not finish"}</b>
      <span class="line">${esc(t.last)}</span><button class="btn sm" data-view="activity">Show output</button><button class="round sm" data-act="dismiss" aria-label="Hide this">${ic("x")}</button>`;
  }
}
function renderNotices() {
  const s = S.state.setup;
  let h = "";
  if (s.database === "unreachable") h = `<div class="notice bad"><p><b>The database is not answering.</b> Start PostgreSQL, then reload this page. ${esc(s.error)}</p></div>`;
  else if (s.database === "behind") h = `<div class="notice"><p><b>The database needs ${s.pending.length === 1 ? "one update" : s.pending.length + " updates"}</b> before anything else works. It only adds what the new features need; your jobs stay as they are.</p>
      <button class="btn primary" data-act="migrate">Update the database</button></div>`;
  else if (!s.profile) h = `<div class="notice"><p><b>Import your resume to begin.</b> Jobs are scored against it, and emails are written from it.</p>
      <button class="btn primary" data-act="resume">${ic("upload")}Choose your resume</button></div>`;
  if ($("#notices").dataset.k !== h) { $("#notices").innerHTML = h; $("#notices").dataset.k = h; }
}

/* ---------- task runner ---------- */
async function startTask(body) {
  try {
    const r = await api(body.action === "profile" ? "/api/profile" : "/api/task", body.raw ? undefined : body, body.raw);
    S.state.task = r.task; S.lines = []; S.taskId = r.task.id; S.wasRunning = true;
    renderChrome(); if (S.view === "activity") renderPage(); if (LIST.includes(S.view)) renderWidgets(); pollTask();
  } catch (e) { fail(e); }
}
function trackTask() {
  const t = S.state.task;
  if (t && t.id !== S.taskId) { S.taskId = t.id; S.lines = []; }
  if (t && t.running && !S.polling) { S.wasRunning = true; pollTask(); }
}
async function pollTask() {
  if (S.polling) return;
  S.polling = true;
  try {
    for (;;) {
      const { task } = await api(`/api/task?since=${S.lines.length}`);
      if (!task) break;
      if (task.id !== S.taskId) { S.taskId = task.id; S.lines = []; continue; }
      S.lines.push(...task.lines); delete task.lines;
      S.state.task = task; renderLive();
      const out = $("#taskout"); if (out) { out.textContent = S.lines.join("\n") || "No output yet."; out.scrollTop = out.scrollHeight; }
      if (!task.running) { finished(task); break; }
      await new Promise(r => setTimeout(r, 900));
    }
  } catch (e) { fail(e); }
  S.polling = false;
}
async function finished(t) {
  if (!S.wasRunning) return;
  S.wasRunning = false;
  const ok = t.exit_code === 0 && !t.stopped;
  toast(`${t.label}: ${t.stopped ? "stopped" : ok ? "done" : "did not finish. " + (t.last || "")}`, !ok);
  S.settings = null; S.insights = null;
  await refresh(); staleMatches();
  if (S.sel && !S.dirty) openJob(S.sel, true);
  if (!LIST.includes(S.view)) loadPage();
}

/* ---------- table ---------- */
function rowsFor(view) {

document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-apply]") && S.detail) S.applyPending = { id: S.detail.job.id, title: S.detail.job.title, company: S.detail.job.company };
  const p = t.closest("[data-p]"); if (p) return runPalette(p.dataset.p);
  const act = t.closest("[data-act]");
  if (!act || act.dataset.act !== "run-menu") $("#runmenu").hidden = true;
  if (act) { if (!act.disabled) A[act.dataset.act](act); return; }
  const g = t.closest("[data-go]"); if (g) return go(g.dataset.go);
  const pg = t.closest("[data-page]"); if (pg) { if (!pg.disabled) { S.page = +pg.dataset.page; renderList(); } return; }
  const th = t.closest("th[data-sort]"); if (th) return sortBy(th.dataset.sort);
  const job = t.closest("[data-job]"); if (job) return openJob(+job.dataset.job);
  const v = t.closest("[data-view]"); if (v) showView(v.dataset.view);
});
document.addEventListener("input", e => {
  const id = e.target.id;
  if (id === "subj" || id === "body" || id === "note" || id === "addr") S.dirty = true;
  if (id === "tq") { S.q = e.target.value; S.page = 0; renderList(); }
  if (id === "pq") drawPalette();
});
document.addEventListener("change", e => {
  const el = e.target, id = el.id;
  if (id === "f-country") S.f.country = el.value;
  if (id === "f-score") S.f.score = +el.value;
  if (id === "f-posted") S.f.posted = +el.value;
  if (id === "f-extra") S.f.extra = el.value;
  if (id.startsWith("f-")) { S.page = 0; renderList(); }
  if (id === "onesite" && el.value) { startTask({ action: "run", source: el.value }); el.value = ""; $("#runmenu").hidden = true; }
  if (id === "setstatus" && el.value) change("/api/status", { job_id: S.sel, status: el.value });
  if (id === "resumefile" && el.files[0]) { const f = el.files[0];
    startTask({ action: "profile", raw: { body: f, headers: { "X-Filename": encodeURIComponent(f.name) } } }); el.value = ""; }
});
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); return openPalette(); }
  if ($("#palette").open) {
    const items = $$("#plist button"), i = items.findIndex(b => b.classList.contains("cur"));
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!items.length) return;
      items[i]?.classList.remove("cur"); const n = items[(i + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length]; n.classList.add("cur"); n.scrollIntoView({ block: "nearest" }); }
    if (e.key === "Enter" && items[i]) { e.preventDefault(); runPalette(items[i].dataset.p); }
    return;
  }
  if (document.querySelector("dialog[open]")) return;
  if (e.key === "Escape" && document.body.classList.contains("reading")) return closeDrawer();
  if (e.key === "Enter" || e.key === " ") {
    if (e.target.matches("tr.row")) { e.preventDefault(); return openJob(+e.target.dataset.job); }
    if (e.target.matches("th[data-sort]")) { e.preventDefault(); return sortBy(e.target.dataset.sort); }
  }
  if (e.target.matches("input,textarea,select") || !S.state || !LIST.includes(S.view)) return;
  if (e.key === "j") step(1);
  if (e.key === "k") step(-1);
});
$("#palette").addEventListener("click", e => { if (e.target.id === "palette") e.target.close(); });
if (!/Mac/.test(navigator.platform)) $("#kbd").textContent = "Ctrl K";
setTheme(document.documentElement.dataset.theme === "light" ? "light" : "dark", true);

(async () => {
  await refresh();
  S.timer = setInterval(() => { if (!document.hidden && !S.polling) refresh(); }, 6000);
})();
</script>
</body>
