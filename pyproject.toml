[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobagent"
version = "0.1.0"
description = "AI job search agent: Browserbase browsing, Claude or OpenAI matching, PostgreSQL tracking"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0",
    "anthropic>=2.6",
    "browserbase>=1.4",
    "playwright>=1.45",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pypdf>=4.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jsa = "jobagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobagent = ["migrations/*.sql", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
