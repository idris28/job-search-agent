# Copy to config.yaml and edit. Secrets go in .env, not here.

search:
  roles:
    - Senior Software Engineer (Java)
    - Backend Engineer
    - Platform Engineer
    - Full-Stack Engineer (Java / React)
  # Matched as whole words against the job's location. Countries plus major cities, because
  # many boards list only the city.
  locations:
    # India
    - India
    - Ahmedabad
    - Gandhinagar
    - Bengaluru
    - Bangalore
    - Pune
    - Hyderabad
    - Mumbai
    - Gurugram
    - Gurgaon
    - Noida
    - Delhi
    # UAE
    - UAE
    - United Arab Emirates
    - Dubai
    - Abu Dhabi
    - Sharjah
    # Saudi Arabia
    - Saudi Arabia
    - KSA
    - Riyadh
    - Jeddah
    - Dammam
    - Khobar
    # Qatar
    - Qatar
    - Doha
  remote_ok: true
  include_title_keywords: [java, backend, back-end, platform, software engineer, software developer,
                           full stack, full-stack, spring, api, sde, sde2, sde3,
                           software development, software dev, member of technical staff,
                           computer scientist]
  exclude_title_keywords: [intern, internship, manager, director, sales, recruiter, android, ios,
                           data scientist, qa, test engineer, marketing]
  # Company names containing these words are dropped before scoring.
  exclude_company_keywords: [bank, banking]
  # The matcher marks jobs in these industries as "poor" (score <= 30), which catches
  # employers whose name doesn't say "bank" and consultancies placing people at banks.
  exclude_industries: [banking, retail banking, investment banking]
  max_age_days: 7          # only jobs posted in the last week; newest are listed first
  min_salary_lpa: 20       # rupee jobs stating less than 20 lakhs a year are dropped; unstated pay is kept
  notes: >
    Based in Ahmedabad, India. Open to relocating to the UAE, Saudi Arabia, or Qatar (would need
    employer visa sponsorship there; this is normal for Gulf roles and is not a red flag). Remote
    roles are fine only if they hire from India or the Gulf. Prefers Java/Spring backend or
    platform work; also open to full-stack with React.

matching:
  shortlist_min_score: 75   # auto-shortlist jobs at or above this score
  max_jobs_to_score: 100    # cost cap per run
  notify_min_score: 85      # message you about new jobs scoring this or more (0 = off)
  max_tokens_per_run: 600000        # stop a run after this many AI tokens (0 = no limit)
  max_browser_minutes_per_run: 30   # stop collecting after this much browser time (0 = no limit)
  concurrency: 4
  # Three ways to spend less on AI. All are off as written here.
  prescreen_model: ""       # a cheaper model for a quick first check, e.g. claude-haiku-5-5;
                            # jobs it rules out skip the full scoring
  reader_model: ""          # a cheaper model for reading job-site pages into lists of jobs,
                            # e.g. claude-haiku-5-5; scoring and emails keep the main model
  batch_scoring: false      # `jsa daily` sends its scoring as one batch: half price, answered later (Claude only)
  batch_wait_minutes: 120   # how long a run waits for a batch; after that the next run picks the answers up

# Backups (`jsa backup`, and the end of `jsa daily`)
backup:
  folder: backups   # where the copies go
  keep: 7           # how many are kept
  daily: true       # make one at the end of `jsa daily`

# Recruiter emails (`jsa email`)
outreach:
  notice_period: ""        # e.g. "60 days, negotiable"; left out of emails when empty
  resume_filename: "Alex_Morgan_Java_Engineer.pdf"
  email: ""                # contact email in the sign-off; the resume's when empty
  linkedin_url: ""         # shown in emails as a clickable "LinkedIn" link
  resume_path: ""          # CV file attached to sent emails and Gmail drafts, e.g. ~/Documents/My_CV.pdf
  # Other CVs. The first one whose keyword appears in the job title or description is attached
  # instead of resume_path. Leave path empty to keep a variant switched off.
  resume_variants:
    - name: Java + AI
      path: ""             # e.g. ~/Documents/My_CV_Java_AI.pdf
      keywords: [llm, genai, generative ai, machine learning, ai/ml, agentic, langchain, rag]
  follow_up_days: 6        # a follow-up is due this many days after an email was sent
  max_sends_per_day: 10    # `jsa email --send` stops at this many emails a day (0 = no limit)
  send_pause_seconds: 20   # wait between sent emails
  research: true           # web-search what recruiters in each country look for (Claude only)
  max_searches: 4          # web searches per country (Anthropic bills web search per use)
  review: true             # review each draft as a recruiter would, then revise
  min_review_score: 8      # revise drafts scored below this (1-10)
  max_revisions: 2
  # Your own email wording. Each draft is this file filled in for the job: text in
  # [square brackets] is replaced, the rest is kept as written (research and review above are
  # then skipped). Remove the file or set this to "" to use the built-in format instead.
  template_file: email_template.txt
  # Your own cover letter, filled in the same way for "Write a cover letter" / `jsa cover-letter`.
  # Remove the file or set this to "" to get a short built-in cover letter instead.
  cover_letter_template_file: cover_letter_template.txt
  # The email for a general application: an HR address with no posting (`jsa add-contacts`, or
  # "Add HR addresses" on the website).
  general_template_file: general_email_template.txt

# Job board searches (kind: generic) open in a browser. By default that is Browserbase, which needs
# BROWSERBASE_API_KEY (BROWSERBASE_PROJECT_ID is optional); with JOBAGENT_BROWSER=local in .env it is
# Chromium on this machine, which needs no key. Each search page is read by the LLM, then up to max_detail_pages job
# pages are opened per run for full descriptions. A job is scored only after its own page was read,
# and a page is opened once; the rest wait for the next run. Some boards use bot protection; check `jsa runs` and
# disable a source that keeps failing.
sources:
  # --- India ---
  - kind: generic
    name: Naukri - Java backend
    urls:
      - https://www.naukri.com/java-backend-developer-jobs?experience=6
      - https://www.naukri.com/java-developer-jobs-in-ahmedabad?experience=6
    max_detail_pages: 15

  # --- UAE / Saudi Arabia / Qatar ---
  - kind: generic
    name: Naukrigulf - Java
    urls:
      - https://www.naukrigulf.com/java-developer-jobs-in-uae
      - https://www.naukrigulf.com/java-developer-jobs-in-saudi-arabia
      - https://www.naukrigulf.com/java-developer-jobs-in-qatar
    max_detail_pages: 15

  - kind: generic
    name: Bayt - Java
    urls:
      - https://www.bayt.com/en/uae/jobs/java-developer-jobs/
      - https://www.bayt.com/en/saudi-arabia/jobs/java-developer-jobs/
      - https://www.bayt.com/en/qatar/jobs/java-developer-jobs/
    max_detail_pages: 15

  - kind: generic
    name: GulfTalent - Java
    urls:
      - https://www.gulftalent.com/jobs/search?keywords=java+developer
    max_detail_pages: 10
    # Returned an empty page on the first run (likely bot protection or a changed URL).
    # To retry, paste the URL of a GulfTalent search from your own browser above.
    enabled: false

  # --- More job sites (added 12 Nov 2026) ---
  # These pages responded when checked, but have not yet been read through the browser. Run one
  # with `jsa run --source "<name>" --no-score` and set `enabled: false` on any that return nothing.
  - kind: generic
    name: Hirist - Java
    urls: [https://www.hirist.tech/k/java-jobs]
    max_detail_pages: 10
  - kind: generic
    name: Instahyre - Java
    urls: [https://www.instahyre.com/java-jobs/]
    max_detail_pages: 10
  - kind: generic
